
name: 🚀 Advanced Auto Dashboard

on:
  push:
    branches: [main, master]

permissions:
  contents: write

# 같은 브랜치에서 워크플로가 동시에 실행되는 것을 방지
concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      # 📥 Checkout
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 🔧 root에 생성된 LeetCode 문제 폴더 정리
      - name: 📦 Organize LeetCode folders
        run: |
          mkdir -p leetcode

          for dir in 0*-*/; do
            if [ -d "$dir" ]; then
              name=$(basename "$dir")

              echo "Merging $name → leetcode/$name"

              mkdir -p "leetcode/$name"
              rsync -a "$dir" "leetcode/$name/"
              rm -rf "$dir"
            fi
          done

      # 📊 Dashboard 업데이트
      - name: 📊 Update Dashboard
        run: |
          LC=$(find leetcode -mindepth 1 -maxdepth 1 -type d -name "0*" 2>/dev/null | wc -l)
          PR=$(find 프로그래머스 -mindepth 2 -type d 2>/dev/null | wc -l)
          BJ=$(find 백준 -mindepth 2 -type d 2>/dev/null | wc -l)

          TOTAL=$((LC + PR + BJ))

          RECENT=$(git log --pretty=format:"- %s" \
            --no-merges \
            --invert-grep \
            --grep="dashboard" \
            -n 5)

          awk -v lc="$LC" -v pr="$PR" -v bj="$BJ" -v total="$TOTAL" -v recent="$RECENT" '
          BEGIN { in_block=0 }

          /<!-- DASHBOARD-START -->/ {
              print "<!-- DASHBOARD-START -->"
              print "## 📊 Platform Statistics"
              print ""
              print "| Platform | Count |"
              print "|----------|-------|"
              print "| 🟡 LeetCode | " lc " |"
              print "| 🔵 Programmers | " pr " |"
              print "| 🟢 Baekjoon | " bj " |"
              print "| 🔢 **Total** | " total " |"
              print ""
              print "## 🥇 Recently Solved (Top 5)"
              print recent
              print ""
              print "<!-- DASHBOARD-END -->"
              in_block=1
              next
          }

          /<!-- DASHBOARD-END -->/ {
              in_block=0
              next
          }

          !in_block { print }
          ' README.md > tmp.md && mv tmp.md README.md

      # 💾 Commit & Push
      - name: 💾 Commit & Push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 최신 원격 브랜치를 기준으로 최대 5회 재시도
          for i in 1 2 3 4 5; do
            echo "Attempt $i/5"

            git fetch origin "${GITHUB_REF_NAME}"

            # 충돌이 발생한 이전 작업을 버리고 최신 원격 상태로 초기화
            git reset --hard "origin/${GITHUB_REF_NAME}"
            git clean -fd

            # LeetCode 폴더 정리 재실행
            mkdir -p leetcode

            for dir in [0-9]*; do
              if [[ -d "$dir" ]]; then
                name=$(basename "$dir")
                echo "Organizing $name"

                mkdir -p "leetcode/$name"
                rsync -a "$dir/" "leetcode/$name/"
                rm -rf "$dir"
              fi
            done

            # README가 없으면 생성
            if [[ ! -f leetcode/README.md ]]; then
              printf '# LeetCode Solutions\n\nAuto-organized solutions\n' > leetcode/README.md
            fi

            git add -A

            # 변경 사항이 없으면 성공으로 종료
            if git diff --cached --quiet; then
              echo "No changes needed."
              exit 0
            fi

            git commit -m "🤖 auto: organize LeetCode problems into leetcode/ folder"

            # rebase 없이 바로 push
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed. Fetching latest changes and retrying..."
            sleep 2
          done

          echo "Failed to push after 5 attempts."
          exit 1